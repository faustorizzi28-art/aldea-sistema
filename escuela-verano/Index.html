<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Estética de la campaña "Escuela de Verano 2026-27": azul pileta, azul marino, tarjetas blancas con borde marino
     y los colores de VERANO (amarillo, coral, verde, naranja, rosa). Títulos en Lilita One, texto en Archivo. */
  :root{ --f-titulo:'Lilita One','Archivo',system-ui,sans-serif; --f-texto:'Archivo',system-ui,sans-serif; --w-titulo:400;
         --c1:#1E7BC8; --c2:#F2CA11; --marino:#16306A; --pileta1:#5CB9EE; --pileta2:#2B8BD6;
         --amarillo:#F2CA11; --coral:#FF6B5B; --verde:#6CC23A; --naranja:#FFA21F; --rosa:#F25FA8;
         --crema:#E8F4FC; --tinta:#16306A; --gris:#4D6287; --linea:#C9DDEE; --ok:#23884F; --mal:#C0392B; --aviso:#C77600; --wa:#25D366; --r:18px; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--crema);color:var(--tinta);font:16px/1.45 var(--f-texto);-webkit-font-smoothing:antialiased}
  body{padding-bottom:84px}
  h1,h2,h3{margin:0 0 .4em;line-height:1.1}
  .serif{font-family:var(--f-titulo);font-weight:var(--w-titulo)}
  a{color:var(--c1)}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  .top{position:sticky;top:0;z-index:20;background:var(--c1);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
  .top .marca{flex:1;font:var(--w-titulo) 22px var(--f-titulo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .marca small{font:500 12px var(--f-texto);opacity:.7;margin-left:6px}
  .top button,.top select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
  .top select{max-width:150px}
  .top select option{color:#000}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--marino);border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--c1);color:#fff;text-decoration:none;transition:transform .08s,opacity .15s;box-shadow:0 3px 0 var(--marino)}
  .btn:active{box-shadow:0 1px 0 var(--marino);transform:translateY(2px)}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn.acento{background:var(--c2);color:var(--c1)}
  .btn.claro{background:#fff;color:var(--marino);border:2px solid var(--marino)}
  .btn.xs,.btn.sm{box-shadow:0 2px 0 var(--marino)}
  .btn.wa{background:var(--wa);color:#fff;border-color:#14753a;box-shadow:0 3px 0 #14753a}
  .btn.mal{background:var(--mal)}
  .btn.full{width:100%}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn.xs{padding:5px 10px;font-size:13px;font-weight:600}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .fila>*{flex:0 0 auto}
  .crece{flex:1 1 auto!important}
  .card{background:#fff;border-radius:var(--r);padding:18px;border:2.5px solid var(--marino);box-shadow:0 4px 0 rgba(22,48,106,.22);margin:14px 0}
  .card h3{font:var(--w-titulo) 21px/1.1 var(--f-titulo);letter-spacing:.01em}
  .muted{color:var(--gris)}
  .chico{font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--crema);font-size:13px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
  .chip.ok{background:#DDF3E5;color:#1C6B3F}.chip.mal{background:#FBE1DE;color:#9B2B20}.chip.aviso{background:#FFF0CC;color:#8A5A00}.chip.info{background:#E2ECF7;color:#1C4C7A}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
  label small{font-weight:400;color:var(--gris)}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=time],input[type=month],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--c1)}
  textarea{min-height:80px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .opcion{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;cursor:pointer;margin:8px 0}
  .opcion.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 7%,#fff)}
  .opcion.off{opacity:.45;pointer-events:none}
  .opcion input{margin-top:3px;accent-color:var(--c1);width:18px;height:18px}
  .seg{display:flex;background:#fff;border:1.5px solid var(--linea);border-radius:999px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--gris)}
  .seg button.on{background:var(--c1);color:#fff}
  .hero{background:repeating-radial-gradient(circle at 85% 115%,rgba(255,255,255,.08) 0 26px,rgba(255,255,255,0) 26px 52px),linear-gradient(180deg,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1));color:#fff;padding:40px 16px 34px;position:relative;overflow:hidden}
  .hero h1{font:var(--w-titulo) clamp(38px,9vw,64px)/1 var(--f-titulo);color:#fff;-webkit-text-stroke:2px var(--marino);paint-order:stroke fill;text-shadow:0 4px 0 var(--marino);letter-spacing:.01em}
  .hero h1 em{color:var(--c2);font-style:normal}
  .titulo-borde{font:var(--w-titulo) 30px/1.05 var(--f-titulo);color:#fff;-webkit-text-stroke:2px var(--marino);paint-order:stroke fill;text-shadow:0 3px 0 var(--marino)}
  .ceja{font:700 12px var(--f-texto);letter-spacing:.24em;text-transform:uppercase}
  .verano{display:inline-flex;gap:0;font:var(--w-titulo) clamp(54px,15vw,96px)/1 var(--f-titulo);-webkit-text-stroke:3px var(--marino);paint-order:stroke fill;text-shadow:0 5px 0 var(--marino)}
  .verano span:nth-child(1){color:var(--amarillo)}.verano span:nth-child(2){color:var(--coral)}.verano span:nth-child(3){color:#fff}
  .verano span:nth-child(4){color:var(--verde)}.verano span:nth-child(5){color:var(--naranja)}.verano span:nth-child(6){color:var(--rosa)}
  .temporada-pill{display:inline-block;background:var(--marino);color:#fff;border-radius:999px;padding:6px 18px;font:var(--w-titulo) 22px var(--f-titulo)}
  .pildora{display:inline-block;background:#fff;color:var(--marino);border:2.5px solid var(--marino);border-radius:999px;padding:6px 14px;font:var(--w-titulo) 15px var(--f-titulo);text-transform:uppercase;letter-spacing:.02em}
  .pildora.si{background:var(--amarillo)}
  .turno-et{font:var(--w-titulo) 20px/1 var(--f-titulo);text-transform:uppercase;-webkit-text-stroke:1.5px var(--marino);paint-order:stroke fill}
  .franja{border:2.5px solid var(--marino);border-radius:16px;padding:12px 16px;margin:12px 0;color:#fff;box-shadow:0 4px 0 rgba(22,48,106,.22)}
  .franja.coral{background:var(--coral)}.franja.marino{background:var(--marino)}
  .franja b.t{font:var(--w-titulo) 22px var(--f-titulo);text-transform:uppercase;-webkit-text-stroke:1.2px var(--marino);paint-order:stroke fill;margin-right:8px}
  .info2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.info2{grid-template-columns:1fr}}
  .info2>div{background:var(--marino);color:#fff;border-radius:16px;padding:12px 14px}
  .info2 b{display:block;font:var(--w-titulo) 18px var(--f-titulo);text-transform:uppercase;color:var(--amarillo)}
  table.precios{width:100%;border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums;margin:0 -4px}
  table.precios th{background:var(--amarillo);color:var(--marino);border-radius:10px;padding:8px 2px;font:var(--w-titulo) 13px var(--f-titulo);text-transform:uppercase}
  table.precios th small{display:block;font:600 10px var(--f-texto);text-transform:none}
  table.precios td{background:#FFF6CF;border-radius:8px;padding:11px 2px;text-align:center;font-weight:800;color:var(--marino);font-size:13px;white-space:nowrap}
  table.precios .turno-et{font-size:16px}
  table.precios td s{display:block;font:600 10.5px var(--f-texto);color:#7d8aa8;margin-top:2px}
  table.precios td.et{background:none;text-align:left;padding-left:0}
  table.precios td.et small{display:block;font-weight:600;font-size:11px;color:var(--gris)}
  .badge-preventa{margin:22px auto -6px;width:156px;height:156px;border-radius:50%;background:var(--amarillo);border:3px solid var(--marino);color:var(--marino);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);box-shadow:0 5px 0 var(--marino)}
  .badge-preventa b{font:var(--w-titulo) 24px/1 var(--f-titulo)}
  .badge-preventa i{font:var(--w-titulo) 34px/1 var(--f-titulo);font-style:normal;color:var(--coral);-webkit-text-stroke:1.5px var(--marino);paint-order:stroke fill}
  .badge-preventa small{font:700 10px var(--f-texto);text-transform:uppercase;letter-spacing:.04em}
  .pasos-res{display:grid;gap:10px;counter-reset:p}
  .pasos-res div{display:flex;gap:12px;align-items:center;background:#fff;border:2.5px solid var(--marino);border-radius:14px;padding:10px 12px;font-weight:700}
  .pasos-res span{flex:0 0 38px;height:38px;border-radius:50%;border:2.5px solid var(--marino);display:flex;align-items:center;justify-content:center;font:var(--w-titulo) 20px var(--f-titulo)}
  .logo-aldea{display:inline-flex;align-items:center;gap:.45em;font:800 1em/1 var(--f-texto);letter-spacing:.2em;white-space:nowrap}
  .logo-aldea svg{height:1.6em;width:auto;flex:0 0 auto}
  .hero p{max-width:560px;opacity:.9;font-size:17px}
  .sol{display:none}
  .sedes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:-22px;position:relative}
  @media(max-width:640px){.sedes{grid-template-columns:1fr}}
  .sede{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08);display:flex;flex-direction:column}
  .sede .banda{padding:18px;color:#fff}
  .sede .banda h2{font:var(--w-titulo) 32px var(--f-titulo);margin:0}
  .sede .cuerpo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .sede ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
  .sede li b{display:inline-block;min-width:96px;color:var(--gris);font-weight:600}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
  table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pasos{display:flex;gap:6px;margin:16px 0}
  .pasos span{flex:1;height:6px;border-radius:9px;background:var(--linea)}
  .pasos span.on{background:var(--c1)}
  .presu{position:sticky;bottom:0;z-index:10;background:var(--c1);color:#fff;border-radius:18px 18px 0 0;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.18);margin:0 -16px}
  .presu .monto{font:700 24px var(--f-texto)}
  .presu small{opacity:.8;display:block;font-size:12px}
  .semana{border:1.5px solid var(--linea);border-radius:14px;padding:10px 12px;background:#fff;margin:8px 0}
  .semana.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 7%,#fff)}
  .dias{display:flex;gap:6px;margin-top:8px}
  .dias button{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid var(--linea);background:#fff;font-weight:600;font-size:13px;cursor:pointer}
  .dias button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
  .dias button[disabled]{opacity:.3}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linea);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--gris);padding:6px 2px;cursor:pointer}
  .nav button i{font-style:normal;font-size:21px;line-height:1}
  .nav button.on{color:var(--c1)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 15px;background:#fff;font-weight:600;cursor:pointer;color:var(--gris);box-shadow:0 1px 0 var(--linea)}
  .tabs button.on{background:var(--c1);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
  .kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--linea)}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:12px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .barra{height:8px;border-radius:9px;background:var(--linea);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--c1)}
  .lista-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
  .lista-item:last-child{border-bottom:0}
  .asis{display:flex;gap:4px}
  .asis button{width:42px;height:40px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;font-weight:700;cursor:pointer}
  .asis button.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}
  .asis button.on.t{background:var(--aviso);color:#fff;border-color:var(--aviso)}
  .asis button.on.a{background:var(--mal);color:#fff;border-color:var(--mal)}
  .marcar{width:100%;aspect-ratio:2.2/1;max-height:220px;border:0;border-radius:24px;font:700 26px var(--f-texto);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .marcar small{font:500 14px var(--f-texto);opacity:.85}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
  .fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--linea);cursor:zoom-in}
  .vid{position:relative;aspect-ratio:1;border-radius:10px;background:#1F2A22;cursor:pointer;overflow:hidden}
  .vid img{width:100%;height:100%;object-fit:cover;opacity:.75}
  .vid span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .prog{height:10px;border-radius:9px;background:var(--linea);overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
  .logo{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:22%;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
  .logo-ini{font:700 15px var(--f-texto);letter-spacing:.02em}
  .top .logo{width:30px;height:30px}
  .logo-ancho{display:block;width:auto;max-width:100%;flex:0 0 auto;object-fit:contain}
  .eleccion{display:grid;gap:14px;margin-top:-26px;position:relative}
  .eleccion button{display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:22px;padding:18px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);cursor:pointer;color:var(--tinta);font:inherit;border-left:8px solid var(--c)}
  .eleccion button:focus-visible,.rol:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
  .eleccion .logo{width:72px;height:72px}
  .logo-chapa{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:#1F8F4E;color:var(--amarillo);border:2.5px solid var(--marino);border-radius:16px;padding:9px 12px 9px 10px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--marino)}
  .logo-chapa svg{height:38px;width:auto}
  .logo-chapa b{display:block;font:var(--w-titulo) 25px/0.95 var(--f-titulo)!important;color:var(--amarillo);letter-spacing:.02em}
  .logo-chapa small{display:block;font:var(--w-titulo) 12.5px/1 var(--f-titulo);letter-spacing:.12em;color:#fff;margin-top:2px}
  .eleccion b{display:block;font:var(--w-titulo) 30px/1.05 var(--f-titulo)}
  .eleccion .flecha{margin-left:auto;font-size:24px;color:var(--c)}
  .roles{display:grid;gap:12px}
  .rol{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--linea);background:#fff;border-radius:18px;padding:16px;text-align:left;font:inherit;color:var(--tinta);cursor:pointer;text-decoration:none;width:100%}
  .rol .ico{font-size:30px;line-height:1}
  .rol b{font-size:18px}
  .rol.principal{border-color:var(--c1)}
  .acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  @media(max-width:420px){.acciones{grid-template-columns:1fr}}
  .glorin{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gris);text-decoration:none;font-size:14px;padding:6px 0}
  .glorin img{width:110px;height:auto}
  .monto-op{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .post{background:#fff;border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 0 var(--linea)}
  .banner{border-radius:14px;padding:14px;background:var(--c2);color:var(--c1);margin:10px 0}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,28,22,.55);display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .modal .caja{background:var(--crema);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
  @media(min-width:700px){.modal{align-items:center}.modal .caja{border-radius:22px}}
  .modal .cerrar{float:right;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1F2A22;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
  #toast.mal{background:var(--mal)}
  .cargando{display:flex;align-items:center;justify-content:center;min-height:60vh;font:var(--w-titulo) 28px var(--f-titulo);color:var(--c1)}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .wa-flota{position:fixed;right:16px;bottom:18px;z-index:25;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .pie{text-align:center;padding:30px 16px;color:var(--gris);font-size:14px}
  .pie a{margin:0 8px}
  .vacio{text-align:center;color:var(--gris);padding:26px 10px}
  .codigo{letter-spacing:10px;font-size:26px!important;text-align:center;font-weight:700}
  .sep{height:1px;background:var(--linea);margin:14px 0}
  .derecha{text-align:right}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="cargando">☀️ Cargando…</div></div>
<div id="modal" class="modal" hidden onclick="if(event.target===this)cerrarModal()"><div class="caja" id="modalCaja"></div></div>
<div id="toast"></div>

<script>

const $ = s => document.querySelector(s);

const sede = id => PUB.sedes.find(s => s.id === id);

function logoSede(id, tam, claro) {
  const s = sede(id); if (!s) return '';
  const st = tam ? ` style="width:${tam}px;height:${tam}px"` : '';
  const ancho = !s.logo && LOGOS_ANCHOS[id];
  if (ancho) return `<img class="logo-ancho" src="${claro ? ancho.color : ancho.blanco}" alt="Logo de ${esc(s.nombre)}" style="height:${tam || 30}px">`;
  if (s.logo) return `<span class="logo"${st}><img src="${esc(s.logo)}" alt="Logo de ${esc(s.nombre)}"></span>`;
  if (id === 'aldea') return `<span class="logo-aldea" style="color:${claro ? 'var(--marino)' : '#fff'};font-size:${Math.round((tam || 30) * 0.42)}px">${CARPA}<span>ALDEA DE VALLE</span></span>`;

}

const gruposBase = () => PUB.grupos.filter(g => !g.base);

function api(accion, datos, rol) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => {
      if (r && r.ok) return res(r.data);
      if (r && r.auth && rol) { LS.del('tok_' + rol); setTimeout(() => location.reload(), 1500); }
      rej(new Error((r && r.error) || 'Algo falló. Probá de nuevo.'));
    }).withFailureHandler(e => rej(new Error(e && e.message ? e.message : 'Sin conexión. Probá de nuevo.')))
      .api(accion, datos || {}, rol ? LS.get('tok_' + rol, '') : '');
  });
}

  const txt = btn ? btn.innerHTML : '';

}

function marcar(btn) {

  let mejor = null, fin = false;
  const terminar = () => {
    if (fin) return; fin = true; navigator.geolocation.clearWatch(wid);
    if (!mejor) { btn.disabled = false; btn.innerHTML = txt; return toast('No pudimos leer tu ubicación. Activá el GPS (ubicación precisa) y probá de nuevo.', true); }
    api('marcar', { lat: mejor.latitude, lng: mejor.longitude, precision: mejor.accuracy, esperado: PR.abierto ? 'SALIDA' : 'ENTRADA' }, 'profe')
      .then(r => { if (r.faltaFoto) { toast(r.mensaje, true); return vProfe('subir'); } if (r.refrescar) toast(r.mensaje, true); else toast((r.tipo === 'ENTRADA' ? '¡Buen día! Entrada ' : '¡Gracias! Salida ') + r.hora + ' · ' + r.sede); profeCargar('hoy'); })
      .catch(e => { toast(e.message, true); btn.disabled = false; btn.innerHTML = txt; });
  };
  const wid = navigator.geolocation.watchPosition(p => { if (!mejor || p.coords.accuracy < mejor.accuracy) mejor = p.coords; if (mejor.accuracy <= 25) terminar(); },
    e => { if (!mejor) { fin = true; navigator.geolocation.clearWatch(wid); btn.disabled = false; btn.innerHTML = txt; toast(e.code === 1 ? 'Tenés que permitir la ubicación para marcar.' : 'No pudimos leer tu ubicación.', true); } },

}

function achicar(file) {

function subirLogo(input, id) {
  const f = input.files[0]; if (!f) return;
  (async () => {
    try {
      const png = /png/.test(f.type) && f.size < 1.5 * 1048576;
      const b64 = png ? await b64De(f) : await achicar(f);
      await api('subirLogo', { sede: id, b64, tipo: png ? 'image/png' : 'image/jpeg' }, 'admin');
      PUB = Object.assign(PUB, { sedes: (await api('publico')).sedes });
      toast('Logo actualizado ✓'); adminCargar('ajustes');
    } catch (e) { toast(e.message, true); }
  })();
}
function usarUbic(btn, id) {

  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(p => {
    api('fijarUbicacion', { sede: id, lat: p.coords.latitude, lng: p.coords.longitude, radio: val('rad' + id) }, 'admin')
      .then(() => { toast('Ubicación guardada (precisión ' + Math.round(p.coords.accuracy) + ' m) ✓'); adminCargar('ajustes'); })
      .catch(e => { toast(e.message, true); btn.disabled = false; });
  }, () => { toast('No se pudo leer la ubicación.', true); btn.disabled = false; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
</script>
</body>
</html>
