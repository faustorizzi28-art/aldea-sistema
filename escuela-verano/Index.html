<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{ --c1:#2F4A38; --c2:#F2CA11; --crema:#F4EFE3; --tinta:#1F2A22; --gris:#6B6F68; --linea:#E3DCCB; --ok:#2E8B57; --mal:#C0392B; --aviso:#E08A00; --wa:#25D366; --r:16px; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--crema);color:var(--tinta);font:16px/1.45 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:84px}
  h1,h2,h3{margin:0 0 .4em;line-height:1.1}
  .serif{font-family:'Instrument Serif',serif;font-weight:400}
  a{color:var(--c1)}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  .top{position:sticky;top:0;z-index:20;background:var(--c1);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
  .top .marca{flex:1;font:400 22px 'Instrument Serif',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .marca small{font:500 12px 'Archivo';opacity:.7;margin-left:6px}
  .top button,.top select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
  .top select{max-width:150px}
  .top select option{color:#000}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--c1);color:#fff;text-decoration:none;transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn.acento{background:var(--c2);color:var(--c1)}
  .btn.claro{background:#fff;color:var(--c1);border:1.5px solid var(--linea)}
  .btn.wa{background:var(--wa);color:#fff}
  .btn.mal{background:var(--mal)}
  .btn.full{width:100%}
  .btn.sm{padding:8px 14px;font-size:14px}
  .btn.xs{padding:5px 10px;font-size:13px;font-weight:600}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .fila>*{flex:0 0 auto}
  .crece{flex:1 1 auto!important}
  .card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--linea),0 6px 22px rgba(31,42,34,.06);margin:14px 0}
  .card h3{font-size:18px}
  .muted{color:var(--gris)}
  .chico{font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--crema);font-size:13px;font-weight:600;white-space:nowrap}
  .chip.ok{background:#DDF3E5;color:#1C6B3F}.chip.mal{background:#FBE1DE;color:#9B2B20}.chip.aviso{background:#FFF0CC;color:#8A5A00}.chip.info{background:#E2ECF7;color:#1C4C7A}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
  label small{font-weight:400;color:var(--gris)}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=time],input[type=month],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--c1)}
  textarea{min-height:80px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .opcion{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;cursor:pointer;margin:8px 0}
  .opcion.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 7%,#fff)}
  .opcion.off{opacity:.45;pointer-events:none}
  .opcion input{margin-top:3px;accent-color:var(--c1);width:18px;height:18px}
  .seg{display:flex;background:#fff;border:1.5px solid var(--linea);border-radius:999px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--gris)}
  .seg button.on{background:var(--c1);color:#fff}
  .hero{background:var(--c1);color:#fff;padding:40px 16px 34px;position:relative;overflow:hidden}
  .hero h1{font:400 clamp(38px,9vw,64px)/1 'Instrument Serif',serif}
  .hero h1 em{color:var(--c2)}
  .hero p{max-width:560px;opacity:.9;font-size:17px}
  .sol{position:absolute;right:-90px;top:-90px;width:200px;height:200px;border-radius:50%;background:var(--c2);opacity:.85}
  .sedes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:-22px;position:relative}
  @media(max-width:640px){.sedes{grid-template-columns:1fr}}
  .sede{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08);display:flex;flex-direction:column}
  .sede .banda{padding:18px;color:#fff}
  .sede .banda h2{font:400 32px 'Instrument Serif',serif;margin:0}
  .sede .cuerpo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .sede ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
  .sede li b{display:inline-block;min-width:96px;color:var(--gris);font-weight:600}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
  table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pasos{display:flex;gap:6px;margin:16px 0}
  .pasos span{flex:1;height:6px;border-radius:9px;background:var(--linea)}
  .pasos span.on{background:var(--c1)}
  .presu{position:sticky;bottom:0;z-index:10;background:var(--c1);color:#fff;border-radius:18px 18px 0 0;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.18);margin:0 -16px}
  .presu .monto{font:700 24px 'Archivo'}
  .presu small{opacity:.8;display:block;font-size:12px}
  .semana{border:1.5px solid var(--linea);border-radius:14px;padding:10px 12px;background:#fff;margin:8px 0}
  .semana.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 7%,#fff)}
  .dias{display:flex;gap:6px;margin-top:8px}
  .dias button{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid var(--linea);background:#fff;font-weight:600;font-size:13px;cursor:pointer}
  .dias button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
  .dias button[disabled]{opacity:.3}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linea);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--gris);padding:6px 2px;cursor:pointer}
  .nav button i{font-style:normal;font-size:21px;line-height:1}
  .nav button.on{color:var(--c1)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 15px;background:#fff;font-weight:600;cursor:pointer;color:var(--gris);box-shadow:0 1px 0 var(--linea)}
  .tabs button.on{background:var(--c1);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
  .kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--linea)}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:12px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .barra{height:8px;border-radius:9px;background:var(--linea);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--c1)}
  .lista-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
  .lista-item:last-child{border-bottom:0}
  .asis{display:flex;gap:4px}
  .asis button{width:42px;height:40px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;font-weight:700;cursor:pointer}
  .asis button.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}
  .asis button.on.t{background:var(--aviso);color:#fff;border-color:var(--aviso)}
  .asis button.on.a{background:var(--mal);color:#fff;border-color:var(--mal)}
  .marcar{width:100%;aspect-ratio:2.2/1;max-height:220px;border:0;border-radius:24px;font:700 26px 'Archivo';color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .marcar small{font:500 14px 'Archivo';opacity:.85}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
  .fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--linea);cursor:zoom-in}
  .post{background:#fff;border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 0 var(--linea)}
  .banner{border-radius:14px;padding:14px;background:var(--c2);color:var(--c1);margin:10px 0}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,28,22,.55);display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .modal .caja{background:var(--crema);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
  @media(min-width:700px){.modal{align-items:center}.modal .caja{border-radius:22px}}
  .modal .cerrar{float:right;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1F2A22;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
  #toast.mal{background:var(--mal)}
  .cargando{display:flex;align-items:center;justify-content:center;min-height:60vh;font:400 28px 'Instrument Serif',serif;color:var(--c1)}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .wa-flota{position:fixed;right:16px;bottom:18px;z-index:25;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .pie{text-align:center;padding:30px 16px;color:var(--gris);font-size:14px}
  .pie a{margin:0 8px}
  .vacio{text-align:center;color:var(--gris);padding:26px 10px}
  .codigo{letter-spacing:10px;font-size:26px!important;text-align:center;font-weight:700}
  .sep{height:1px;background:var(--linea);margin:14px 0}
  .derecha{text-align:right}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="cargando">☀️ Cargando…</div></div>
<div id="modal" class="modal" hidden onclick="if(event.target===this)cerrarModal()"><div class="caja" id="modalCaja"></div></div>
<div id="toast"></div>

<script>
/* ================= Base ================= */
let PUB = null, cotizar = null, PAGINA = '', HASH = '';
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ev_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ev_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ev_' + k); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = n => '$' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const DSEM = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fecha = iso => new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10), 12);
const fCorta = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const fLarga = iso => { if (!iso) return ''; const f = fecha(iso); return DSEM[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES[f.getMonth()]; };
const sumarDias = (iso, n) => { const f = fecha(iso); f.setDate(f.getDate() + n); return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); };
const lunes = iso => { const f = fecha(iso); return sumarDias(iso, -((f.getDay() + 6) % 7)); };
const ahoraHora = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const sede = id => PUB.sedes.find(s => s.id === id);
const grupo = id => PUB.grupos.find(g => g.id === id) || { id, nombre: id || '—', emoji: '' };
const nGrupo = id => id === 'todos' ? 'Todos los grupos' : (grupo(id).emoji + ' ' + grupo(id).nombre);
const foto = id => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1200';
const wa = (tel, txt) => 'https://wa.me/' + String(tel || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(txt || '');
function edadEn(nac, ref) { let e = +ref.slice(0, 4) - +nac.slice(0, 4); if (ref.slice(5) < nac.slice(5)) e--; return e; }
function grupoPorEdad(nac, ref) {
  const e = edadEn(nac, ref);
  return PUB.grupos.find(g => e >= g.edadMin && e <= g.edadMax) || (e < PUB.grupos[0].edadMin ? PUB.grupos[0] : PUB.grupos[PUB.grupos.length - 1]);
}

function api(accion, datos, rol) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => {
      if (r && r.ok) return res(r.data);
      if (r && r.auth && rol) { LS.del('tok_' + rol); setTimeout(() => location.reload(), 1500); }
      rej(new Error((r && r.error) || 'Algo falló. Probá de nuevo.'));
    }).withFailureHandler(e => rej(new Error(e && e.message ? e.message : 'Sin conexión. Probá de nuevo.')))
      .api(accion, datos || {}, rol ? LS.get('tok_' + rol, '') : '');
  });
}
function toast(msg, mal) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (mal ? ' mal' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', mal ? 4500 : 2600); }
function modal(html) { $('#modalCaja').innerHTML = '<button class="cerrar" onclick="cerrarModal()">✕</button>' + html; $('#modal').hidden = false; }
function cerrarModal() { $('#modal').hidden = true; $('#modalCaja').innerHTML = ''; }
function pintar(html) { $('#app').innerHTML = html; }
async function conBoton(btn, fn) {
  const txt = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = txt; } }
}
function tema(id) {
  const s = id && sede(id);
  document.documentElement.style.setProperty('--c1', s ? s.color : '#2F4A38');
  document.documentElement.style.setProperty('--c2', s ? s.acento : '#F2CA11');
}
function copiar(txt) { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiado ✓')).catch(() => prompt('Copiá esto:', txt)); }
function verFoto(id) { modal('<img src="' + foto(id) + '" style="width:100%;border-radius:14px;margin-top:10px" alt="">'); }
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

google.script.url.getLocation(loc => {
  PAGINA = (loc.parameter && loc.parameter.p) || '';
  HASH = loc.hash || '';
  api('publico').then(d => {
    PUB = d;
    cotizar = new Function('return ' + d.cotizar)();
    arrancar();
  }).catch(e => pintar('<div class="cargando">No pudimos cargar 😕<br><small style="font-size:16px">' + esc(e.message) + '</small></div>'));
});

function arrancar() {
  if (PAGINA === 'profes') return LS.get('tok_profe') ? profeCargar() : vLogin('profe');
  if (PAGINA === 'admin') return LS.get('tok_admin') ? adminCargar() : vAdminLogin();
  if (PAGINA === 'cuenta' || HASH === 'renovar') return LS.get('tok_familia') ? cuentaCargar() : vLogin('familia');
  const b = LS.get('borrador');
  if (b && b.paso && b.sede && sede(b.sede)) { W = b; return vWizard(); }
  vInicio();
}

/* ================= FAMILIAS · público ================= */
function precioDesde(s) { return s.precios.semanas[1]; }

function vInicio() {
  tema(null);
  const s = PUB.sedes;
  const etiquetas = s[0].ficha.map(f => f[0]);
  pintar(`
  <header class="top"><div class="marca">☀️ ${esc(PUB.marca)} <small>${esc(PUB.temporada)}</small></div><button onclick="irCuenta()">Mi cuenta</button></header>
  <section class="hero"><div class="sol"></div><div class="wrap" style="position:relative">
    <h1>Un verano para<br><em>acordarse siempre</em></h1>
    <p>Pileta, deporte, juegos y amigos. Elegí la sede, armá tu presupuesto en un minuto e inscribí a tus hijos desde el celular.</p>
  </div></section>
  <div class="wrap">
    <div class="sedes">${s.map(x => `
      <article class="sede">
        <div class="banda" style="background:${x.color}"><h2>${esc(x.nombre)}</h2><div style="opacity:.85">${esc(x.bajada)}</div></div>
        <div class="cuerpo">
          <ul>${x.ficha.slice(0, 4).map(f => `<li><b>${esc(f[0])}</b>${esc(f[1])}</li>`).join('')}</ul>
          <div class="muted chico">Del ${fLarga(x.inicio)} al ${fLarga(x.fin)}</div>
          <div><span class="muted">Semana desde</span> <b style="font-size:20px">${pesos(precioDesde(x))}</b></div>
          <div class="fila" style="margin-top:auto">
            <button class="btn" style="background:${x.color}" onclick="vSede('${x.id}')">Ver todo</button>
            <button class="btn acento" style="background:${x.acento};color:${x.color}" onclick="empezar('${x.id}')">Inscribir</button>
          </div>
        </div>
      </article>`).join('')}
    </div>

    <div class="card">
      <h2 class="serif" style="font-size:30px">¿Qué diferencia hay?</h2>
      <div class="scroll-x"><table class="t">
        <tr><th></th>${s.map(x => `<th style="color:${x.color}">${esc(x.nombre)}</th>`).join('')}</tr>
        ${etiquetas.map((e, i) => `<tr><td><b>${esc(e)}</b></td>${s.map(x => `<td>${esc((x.ficha[i] || [])[1] || '—')}</td>`).join('')}</tr>`).join('')}
        <tr><td><b>Día suelto</b></td>${s.map(x => `<td>${pesos(x.precios.dia)}</td>`).join('')}</tr>
        <tr><td><b>1 semana</b></td>${s.map(x => `<td>${pesos(x.precios.semanas[1])}</td>`).join('')}</tr>
        <tr><td><b>4 semanas</b></td>${s.map(x => `<td>${pesos(x.precios.semanas[4])}</td>`).join('')}</tr>
        <tr><td><b>Dirección</b></td>${s.map(x => `<td>${esc(x.direccion)}</td>`).join('')}</tr>
      </table></div>
    </div>

    <div class="card">
      <h3>¿Ya inscribiste a tus hijos?</h3>
      <p class="muted">Entrá con tu mail para ver las fotos del día, la asistencia, el cronograma de la semana y renovar.</p>
      <button class="btn" onclick="irCuenta()">Entrar a mi cuenta</button>
    </div>
  </div>
  <div class="pie">¿Trabajás con nosotros? <a href="${PUB.url}?p=profes">Soy profe</a>·<a href="${PUB.url}?p=admin">Administración</a></div>
  <a class="wa-flota" href="${wa(s[0].whatsapp, '¡Hola! Quiero consultar por la escuela de verano.')}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`);
  scrollTo(0, 0);
}

function irCuenta() { location.href = PUB.url + '?p=cuenta'; }

function vSede(id) {
  const s = sede(id); tema(id); LS.set('sede', id);
  const P = s.precios;
  const hoy = PUB.hoy;
  pintar(`

/* ---------- Armador de plan (semanas / días + turno + extras) ---------- */
let PL = null;  // { sede, plan, cant, renov, alCambiar }
function planNuevo(sedeId) { const s = sede(sedeId); return { modalidad: 'semanas', semanas: [], dias: [], turno: s.precios.turnos[0].id, extras: [] }; }
function htmlPlan() {
  const s = sede(PL.sede), p = PL.plan, hoy = PUB.hoy;
  const semanasHtml = s.semanas.map((w, i) => {
    const empezo = w.dias[0] < hoy, termino = w.hasta < hoy;
    if (p.modalidad === 'semanas') {
      const on = p.semanas.includes(w.id);
      return `<label class="opcion ${on ? 'on' : ''} ${empezo ? 'off' : ''}"><input type="checkbox" ${on ? 'checked' : ''} ${empezo ? 'disabled' : ''} onchange="plTogg('semanas','${w.id}')">
        <div class="crece"><b>Semana ${i + 1}</b> · ${fCorta(w.desde)} al ${fCorta(w.hasta)} ${w.dias.length < 5 ? '<span class="chip">' + w.dias.length + ' días</span>' : ''}
        <div class="muted chico">${w.tematica ? esc((w.tematica.emoji || '') + ' ' + w.tematica.titulo) : ''}${empezo ? ' · ya empezó (elegí días sueltos)' : ''}</div></div></label>`;
    }
    if (termino) return '';
    const dias = [0, 1, 2, 3, 4].map(k => sumarDias(w.id, k));
    return `<div class="semana"><b>Semana ${i + 1}</b> <span class="muted chico">${w.tematica ? esc((w.tematica.emoji || '') + ' ' + w.tematica.titulo) : ''}</span>
      <div class="dias">${dias.map(d => { const ok = w.dias.includes(d) && d >= hoy; const on = p.dias.includes(d);
        return `<button ${ok ? '' : 'disabled'} class="${on ? 'on' : ''}" onclick="plTogg('dias','${d}')">${DSEM[fecha(d).getDay()]}<br>${fecha(d).getDate()}</button>`; }).join('')}</div></div>`;
  }).join('');
  return `
    <div class="seg"><button class="${p.modalidad === 'semanas' ? 'on' : ''}" onclick="plSet('modalidad','semanas')">Por semana</button><button class="${p.modalidad === 'dias' ? 'on' : ''}" onclick="plSet('modalidad','dias')">Días sueltos</button></div>
    ${p.modalidad === 'semanas' ? `<div class="fila" style="margin-top:10px"><button class="btn xs claro" onclick="plTodas()">Elegir todas las que quedan</button>${p.semanas.length ? `<button class="btn xs claro" onclick="plSet('semanas',[])">Borrar</button>` : ''}</div>` : `<p class="muted chico">Tocá los días que viene. Si elegís muchos de una misma semana, nunca pagás más que la semana completa.</p>`}
    ${semanasHtml}
    <label>Horario</label>
    ${s.precios.turnos.map(t => `<label class="opcion ${p.turno === t.id ? 'on' : ''}"><input type="radio" name="turno" ${p.turno === t.id ? 'checked' : ''} onchange="plSet('turno','${t.id}')"><div><b>${esc(t.nombre)}</b>${t.factor !== 1 ? `<div class="muted chico">+${Math.round((t.factor - 1) * 100)}%</div>` : ''}</div></label>`).join('')}
    ${s.precios.extras.length ? '<label>Extras</label>' + s.precios.extras.map(e => `<label class="opcion ${p.extras.includes(e.id) ? 'on' : ''}"><input type="checkbox" ${p.extras.includes(e.id) ? 'checked' : ''} onchange="plTogg('extras','${e.id}')"><div><b>${esc(e.nombre)}</b> · ${pesos(e.precioDia)} por día<div class="muted chico">${esc(e.detalle || '')}</div></div></label>`).join('') : ''}`;
}
function plSet(k, v) { PL.plan[k] = v; PL.alCambiar(); }
function plTogg(k, v) { const a = PL.plan[k]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); PL.alCambiar(); }
function plTodas() { PL.plan.semanas = sede(PL.sede).semanas.filter(w => w.dias[0] >= PUB.hoy).map(w => w.id); PL.alCambiar(); }
function plCotizar() { return cotizar(sede(PL.sede), PL.plan, Math.max(1, PL.cant), { hoy: PUB.hoy, renovacion: PL.renov }); }
function htmlPresu(q, texto, accion) {
  const cant = Math.max(1, PL.cant);
  return `<div class="presu"><div class="crece"><small>${q.cantDias ? esc(q.detalleBase) + ' · ' + cant + (cant > 1 ? ' chicos' : ' chico') : 'Elegí cuándo viene'}</small>
    <div class="monto">${pesos(q.total)}</div>${q.descuento ? `<small>Ahorrás ${pesos(q.descuento)}</small>` : ''}</div>
    <button class="btn acento" ${q.errores.length ? 'disabled' : ''} onclick="${accion}">${texto}</button></div>`;
}
function detallePresu(q, nombres) {
  return `<table class="t">${q.porChico.map((c, i) => `<tr><td>${esc(nombres[i] || 'Chico ' + (i + 1))}<div class="muted chico">${esc(q.detalleBase)} · ${esc(q.turno.nombre)}${q.extras.length ? ' · ' + q.extras.map(e => esc(e.nombre)).join(', ') : ''}${c.motivos.length ? '<br>Descuento: ' + esc(c.motivos.join(' + ')) : ''}</div></td>
    <td class="derecha">${c.descuento ? `<s class="muted">${pesos(c.subtotal)}</s><br>` : ''}<b>${pesos(c.total)}</b></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td class="derecha"><b style="font-size:20px">${pesos(q.total)}</b></td></tr>
    <tr><td>Seña para reservar (${q.senaPct}%)</td><td class="derecha"><b>${pesos(q.sena)}</b></td></tr></table>
    <p class="muted chico">Del ${fLarga(q.dias[0] || '')} al ${fLarga(q.dias[q.dias.length - 1] || '')} · ${q.cantDias} días</p>`;
}

/* ---------- Inscripción paso a paso ---------- */
let W = null;
const chicoVacio = () => ({ nombre: '', nacimiento: '', dni: '', obraSocial: '', alergias: '', medicacion: '', condiciones: '', sabeNadar: '', autorizaFotos: 'Sí' });
function empezar(id) {
  const b = LS.get('borrador');

  W.paso = W.paso || 1;
  vWizard();
}
function guardarW() { LS.set('borrador', W); }
function vWizard() {
  const s = sede(W.sede); tema(W.sede);
  PL = { sede: W.sede, plan: W.plan, cant: W.chicos.filter(c => c.nombre).length || W.chicos.length, renov: false, alCambiar: () => { guardarW(); vWizard(); } };
  const titulos = ['¿Cuándo viene?', '¿Quién viene?', 'Tus datos', 'Revisá y confirmá'];
  let cuerpo = '';
  if (W.paso === 1) cuerpo = htmlPlan();
  if (W.paso === 2) cuerpo = W.chicos.map((c, i) => htmlChico(c, i)).join('') + `<button class="btn claro full" onclick="leerChicos();W.chicos.push(chicoVacio());guardarW();vWizard()">+ Sumar otro hijo/a ${s.precios.descuentoHermanos ? '(' + s.precios.descuentoHermanos + '% off)' : ''}</button>`;
  if (W.paso === 3) cuerpo = htmlAdulto(W.adulto);
  if (W.paso === 4) {
    const q = plCotizar();
    cuerpo = `<div class="card"><h3>${esc(s.nombre)}</h3>${detallePresu(q, W.chicos.map(c => c.nombre))}</div>
      <div class="card"><h3>Reglamento</h3><ul class="chico" style="padding-left:18px;margin:0">
        <li>El lugar queda reservado con la seña. El saldo se paga antes del primer día.</li>
        <li>Solo retiran a los chicos los adultos autorizados (con DNI).</li>
        <li>Avisanos cualquier cambio de salud, alergia o medicación.</li>
        <li>Los días que el chico falta no se recuperan ni se devuelven, salvo con certificado médico.</li>
        <li>Traer: malla, toalla, protector solar, gorra, ojotas y botella de agua, todo con nombre.</li>
      </ul>
      <label class="opcion ${W.acepta ? 'on' : ''}" style="margin-top:12px"><input type="checkbox" ${W.acepta ? 'checked' : ''} onchange="W.acepta=this.checked;guardarW();vWizard()"><div>Leí y acepto el reglamento. Los datos de salud son verdaderos.</div></label></div>`;
  }
  const q = plCotizar();
  pintar(`
  <header class="top"><button onclick="${W.paso > 1 ? 'pasoAtras()' : `vSede('${W.sede}')`}">←</button><div class="marca">${esc(s.nombre)} <small>paso ${W.paso} de 4</small></div><button onclick="if(confirm('¿Borrar todo lo cargado?')){LS.del('borrador');vSede('${W.sede}')}">Borrar</button></header>
  <div class="wrap">
    <div class="pasos">${[1, 2, 3, 4].map(n => `<span class="${n <= W.paso ? 'on' : ''}"></span>`).join('')}</div>
    <h2 class="serif" style="font-size:34px">${titulos[W.paso - 1]}</h2>
    ${W.paso === 1 ? `<p class="muted">El precio es por chico. Al sumar hermanos en el paso 2 se aplica el descuento.</p>` : ''}
    <div id="pasoCuerpo">${cuerpo}</div>
    <div style="height:18px"></div>
    ${W.paso < 4 ? htmlPresu(q, 'Seguir →', 'pasoSig()') : `<div class="presu"><div class="crece"><small>Total</small><div class="monto">${pesos(q.total)}</div><small>Seña ${pesos(q.sena)}</small></div><button class="btn acento" ${W.acepta ? '' : 'disabled'} onclick="enviarInscripcion(this)">Inscribir ✓</button></div>`}
  </div>`);
}
function htmlChico(c, i) {
  const s = sede(W.sede);
  const g = c.nacimiento && /^\d{4}-\d{2}-\d{2}$/.test(c.nacimiento) ? grupoPorEdad(c.nacimiento, s.inicio) : null;
  const edad = g ? edadEn(c.nacimiento, s.inicio) : null;
  const sel = (id, v, ops) => `<select id="${id}">${ops.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  return `<div class="card"><div class="fila"><h3 class="crece">${i ? 'Hijo/a ' + (i + 1) : 'Hijo/a'}</h3>${W.chicos.length > 1 ? `<button class="btn xs claro" onclick="leerChicos();W.chicos.splice(${i},1);guardarW();vWizard()">Quitar</button>` : ''}</div>
    <label>Nombre y apellido</label><input type="text" id="ch${i}_nombre" value="${esc(c.nombre)}" autocomplete="off">
    <div class="grid2"><div><label>Fecha de nacimiento</label><input type="date" id="ch${i}_nacimiento" value="${esc(c.nacimiento)}" onchange="leerChicos();guardarW();vWizard()"></div>
    <div><label>DNI</label><input type="tel" id="ch${i}_dni" value="${esc(c.dni)}" inputmode="numeric"></div></div>
    ${g ? `<p style="margin:8px 0 0"><span class="chip info">${g.emoji} Grupo ${esc(g.nombre)} · ${edad} años al empezar</span></p>` : ''}
    ${edad !== null && edad < PUB.edadMin ? `<p class="chip mal" style="margin-top:6px">Es desde los ${PUB.edadMin} años</p>` : ''}
    <label>Obra social / prepaga <small>y número de afiliado</small></label><input type="text" id="ch${i}_obraSocial" value="${esc(c.obraSocial)}">
    <label>Alergias <small>(alimentos, picaduras, remedios…)</small></label><input type="text" id="ch${i}_alergias" value="${esc(c.alergias)}" placeholder="Ninguna">
    <label>Medicación que toma</label><input type="text" id="ch${i}_medicacion" value="${esc(c.medicacion)}" placeholder="Ninguna">
    <label>¿Algo que tengamos que saber? <small>(condición de salud, miedos, necesidades)</small></label><textarea id="ch${i}_condiciones">${esc(c.condiciones)}</textarea>
    <div class="grid2"><div><label>¿Sabe nadar?</label>${sel('ch' + i + '_sabeNadar', c.sabeNadar, ['', 'Sí', 'Un poco', 'No'])}</div>
    <div><label>¿Puede salir en las fotos?</label>${sel('ch' + i + '_autorizaFotos', c.autorizaFotos, ['Sí', 'No'])}</div></div>
  </div>`;
}
function leerChicos() {
  W.chicos = W.chicos.map((c, i) => { const o = {}; Object.keys(chicoVacio()).forEach(k => { const el = document.getElementById('ch' + i + '_' + k); o[k] = el ? el.value.trim() : c[k]; }); return o; });
}
function htmlAdulto(a) {
  const campo = (k, lab, tipo, extra) => `<label>${lab}</label><input type="${tipo || 'text'}" id="ad_${k}" value="${esc(a[k] || '')}" ${extra || ''}>`;
  return `<div class="card"><h3>Adulto responsable</h3>
    ${campo('nombre', 'Nombre y apellido')}
    ${campo('email', 'Mail <small>(con este mail entrás a tu cuenta)</small>', 'email', 'inputmode="email" autocomplete="email"')}
    <div class="grid2"><div>${campo('whatsapp', 'WhatsApp', 'tel', 'inputmode="tel" placeholder="351 123 4567"')}</div><div>${campo('dni', 'DNI', 'tel', 'inputmode="numeric"')}</div></div>
    ${campo('direccion', 'Dirección')}</div>
  <div class="card"><h3>Seguridad</h3>
    <div class="grid2"><div>${campo('emergenciaNombre', 'Contacto de emergencia')}</div><div>${campo('emergenciaTel', 'Teléfono de emergencia', 'tel', 'inputmode="tel"')}</div></div>
    <label>¿Quiénes pueden retirar a los chicos? <small>Nombre y DNI, uno por renglón</small></label><textarea id="ad_autorizadosRetiro" placeholder="Ana Pérez — 30.123.456&#10;Abuelo Juan — 12.345.678">${esc(a.autorizadosRetiro || '')}</textarea>
    <label>¿Cómo nos conociste?</label><select id="ad_comoNosConocio">${['', 'Instagram', 'Recomendación de otra familia', 'Ya vinimos otros años', 'Aldea (canchas, escuelas, eventos)', 'Google', 'Otro'].map(o => `<option ${o === a.comoNosConocio ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
}
function leerAdulto() { ['nombre', 'email', 'whatsapp', 'dni', 'direccion', 'emergenciaNombre', 'emergenciaTel', 'autorizadosRetiro', 'comoNosConocio'].forEach(k => { const el = document.getElementById('ad_' + k); if (el) W.adulto[k] = el.value.trim(); }); }
function pasoAtras() { if (W.paso === 2) leerChicos(); if (W.paso === 3) leerAdulto(); W.paso--; guardarW(); vWizard(); scrollTo(0, 0); }
function pasoSig() {
  const s = sede(W.sede);
  if (W.paso === 1) { const q = plCotizar(); if (q.errores.length) return toast(q.errores[0], true); }
  if (W.paso === 2) {
    leerChicos();
    for (const c of W.chicos) {
      if (!c.nombre) return toast('Falta el nombre de cada chico.', true);
      if (!c.nacimiento) return toast('Falta la fecha de nacimiento de ' + c.nombre + '.', true);
      if (edadEn(c.nacimiento, s.inicio) < PUB.edadMin) return toast(c.nombre + ' tiene que tener al menos ' + PUB.edadMin + ' años.', true);
    }
  }
  if (W.paso === 3) {
    leerAdulto(); const a = W.adulto;
    if (!a.nombre) return toast('Falta tu nombre.', true);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email || '')) return toast('Revisá el mail.', true);
    if ((a.whatsapp || '').replace(/\D/g, '').length < 8) return toast('Falta tu WhatsApp.', true);
    if (!a.emergenciaNombre || !a.emergenciaTel) return toast('Falta el contacto de emergencia.', true);
  }
  W.paso++; guardarW(); vWizard(); scrollTo(0, 0);
}
function enviarInscripcion(btn) {
  conBoton(btn, async () => {

    LS.del('borrador');
    vListo(r);
  });
}

      <div class="fila"><button class="btn claro" onclick="copiar('${esc(alias)}')">Copiar alias</button><a class="btn wa crece" href="${esc(r.waComprobante)}" target="_blank">💬 Mandar comprobante</a></div>

    <div class="card"><h3>¿Y ahora?</h3>

function inscFiltradas() {
  const q = FI.q.toLowerCase();
  return A.inscripciones.filter(i => (!FI.estado || i.estado === FI.estado) && (!FI.grupo || i.grupo === FI.grupo) && (!FI.vigentes || i.hasta >= A.hoy) &&
    (!q || (i.chico + ' ' + i.adulto + ' ' + i.email + ' ' + i.id).toLowerCase().includes(q)));
}
function listaInsc() {
  const L = inscFiltradas();
  $('#listaInsc').innerHTML = `<p class="muted chico">${L.length} inscripciones · ${pesos(L.reduce((a, i) => a + i.total, 0))} · saldo ${pesos(L.reduce((a, i) => a + i.saldo, 0))}</p>
    <div class="card" style="padding:4px 14px">${L.slice(0, 200).map(i => `<div class="lista-item"><div class="crece" style="cursor:pointer" onclick="fichaAdmin('${i.id}')"><b>${esc(i.chico)}</b> <span class="chip">${esc(nGrupo(i.grupo))}</span>

function guardarFicha(btn, id) {
  const i = A.inscripciones.find(x => x.id === id);

    if (val('fgGrupo') !== i.grupo) await api('asignarGrupo', { chicoId: i.chicoId, grupo: val('fgGrupo') }, 'admin');
    if (i.estado !== 'Cancelada' && (Number(val('fgTotal')) !== i.total || val('fgNotas') !== (i.notas || ''))) await api('cambiarEstado', { inscripcionId: id, estado: 'Pendiente', total: val('fgTotal'), notas: val('fgNotas') }, 'admin');
    cerrarModal(); toast('Guardado ✓'); adminCargar();
  });
}
function estadoInsc(btn, id, estado) { conBoton(btn, async () => { await api('cambiarEstado', { inscripcionId: id, estado }, 'admin'); cerrarModal(); toast('Listo ✓'); adminCargar(); }); }
function exportarCSV() {
  const L = inscFiltradas(), cs = {}; A.chicos.forEach(c => cs[c.id] = c);
  const cols = [['ID', i => i.id], ['Sede', i => nomSede(i.sede)], ['Chico', i => i.chico], ['Grupo', i => grupo(i.grupo).nombre], ['Nacimiento', i => (cs[i.chicoId] || {}).nacimiento], ['Adulto', i => i.adulto], ['WhatsApp', i => i.whatsapp], ['Mail', i => i.email],
    ['Desde', i => i.desde], ['Hasta', i => i.hasta], ['Días', i => i.dias.length], ['Turno', i => i.turno], ['Extras', i => i.extras], ['Total', i => i.total], ['Pagado', i => i.pagado], ['Saldo', i => i.saldo], ['Estado', i => i.estado],
    ['Alergias', i => (cs[i.chicoId] || {}).alergias], ['Medicación', i => (cs[i.chicoId] || {}).medicacion], ['Sabe nadar', i => (cs[i.chicoId] || {}).sabeNadar], ['Fotos', i => (cs[i.chicoId] || {}).autorizaFotos]];
  const csv = [cols.map(c => c[0])].concat(L.map(i => cols.map(c => c[1](i)))).map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'inscripciones-' + A.hoy + '.csv'; a.click();
}

}
const PLANTILLAS = {
  abiertas: ['☀️ ¡Abrimos las inscripciones a la escuela de verano!', 'Ya podés inscribir a tus hijos a la escuela de verano. Elegí semanas o días sueltos, mirá las temáticas de cada semana y armá el presupuesto desde el celular.\n\nInscribiéndote antes del fin de noviembre tenés descuento. ¡Los cupos son limitados!'],
  llevar: ['🎒 Qué traer a la escuela de verano', 'Te recordamos qué tiene que traer cada día, todo con nombre:\n\n• Malla y toalla\n• Protector solar y gorra\n• Ojotas\n• Botella de agua\n• Muda de ropa\n\n¡Nos vemos!'],
  cupos: ['⏳ Quedan pocos lugares', 'Se están llenando los grupos de las próximas semanas. Si querés asegurar el lugar, inscribite o renová desde tu cuenta.'],
  lluvia: ['🌧️ Aviso por lluvia', 'Hoy por la lluvia las actividades se hacen bajo techo. Mandá muda de ropa extra. ¡Los esperamos igual!']
};
function aMails() {
  $('#adCuerpo').innerHTML = `<div class="card"><h3>Mandar un mail a las familias</h3>
    <p class="muted chico">Hoy quedan <b>${A.kpis.cuotaMail}</b> mails (Google limita la cantidad por día).</p>
    <div class="fila">${Object.keys(PLANTILLAS).map(k => `<button class="btn xs claro" onclick="document.getElementById('mlA').value=PLANTILLAS['${k}'][0];document.getElementById('mlM').value=PLANTILLAS['${k}'][1]">${PLANTILLAS[k][0].split(' ').slice(0, 4).join(' ')}</button>`).join('')}</div>
    <div class="grid2">${A.sesionSede === 'todas' ? `<div><label>Sede</label><select id="mlS"><option value="todas">Las dos</option>${PUB.sedes.map(s => `<option value="${s.id}" ${s.id === A.sede ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></div>` : ''}
    <div><label>A quién</label><select id="mlD"><option value="activas">Familias con días por delante</option><option value="inscriptas">Todas las familias inscriptas</option><option value="deudores">Las que deben</option><option value="interesados">Interesados (sin inscribir)</option><option value="todos">Inscriptas + interesados</option></select></div>
    <div><label>Grupo</label><select id="mlG"><option value="todos">Todos</option>${PUB.grupos.map(g => `<option value="${g.id}">${g.emoji} ${esc(g.nombre)}</option>`).join('')}</select></div></div>
    <label>Asunto</label><input type="text" id="mlA">
    <label>Mensaje</label><textarea id="mlM" style="min-height:160px"></textarea>
    <div class="fila" style="margin-top:12px"><button class="btn claro" onclick="mandarMail(this,true)">Mandarme una prueba</button><button class="btn" onclick="if(confirm('¿Mandar a todas las familias del filtro?'))mandarMail(this,false)">Enviar</button></div></div>
    <div class="card"><h3>Avisos automáticos</h3><ul class="chico" style="padding-left:18px">
      <li><b>Al inscribirse:</b> resumen, datos de pago y link a su cuenta. A la administración le llega el aviso con botón de WhatsApp.</li>
      <li><b>2 días antes de que termine:</b> mail para renovar con descuento y la temática que viene.</li>
      <li><b>Deudas:</b> recordatorio cada 3 días a quienes ya empezaron o empiezan en 3 días.</li>
      <li><b>Domingos 18 h:</b> la temática y el cronograma de la semana siguiente.</li>
      <li><b>Todos los días 8 h:</b> resumen a la administración con vencimientos, deudas y botones de WhatsApp.</li></ul></div>`;
}
function mandarMail(btn, prueba) {
  conBoton(btn, async () => { const r = await api('mailMasivo', { sede: val('mlS'), a: val('mlD'), grupo: val('mlG'), asunto: val('mlA'), mensaje: document.getElementById('mlM').value, prueba }, 'admin'); toast(prueba ? 'Te llegó la prueba ✓' : 'Enviado a ' + r.enviados + ' familias ✓'); });
}
function aAjustes() {
  const aj = A.ajustes;
  $('#adCuerpo').innerHTML = `${A.ubicaciones.map(u => `<div class="card"><h3>📍 Ubicación de ${esc(u.nombre)}</h3>
      <p class="muted chico">Los profes solo pueden marcar a menos de ${u.radio} m de este punto. Parate en el centro de la sede y tocá “Usar mi ubicación”.</p>
      <p>${u.lat ? `<b>${u.lat.toFixed(6)}, ${u.lng.toFixed(6)}</b> · <a target="_blank" href="https://maps.google.com/?q=${u.lat},${u.lng}">ver en el mapa</a>` : '<span class="chip mal">Sin cargar</span>'}</p>
      <div class="fila"><div><label>Radio (m)</label><input type="number" id="rad${u.id}" value="${u.radio}" style="width:110px"></div>
      <button class="btn" style="margin-top:28px" onclick="usarUbic(this,'${u.id}')">Usar mi ubicación</button>
      ${u.lat ? `<button class="btn claro" style="margin-top:28px" onclick="conBoton(this, async()=>{await api('fijarUbicacion',{sede:'${u.id}',lat:${u.lat},lng:${u.lng},radio:val('rad${u.id}')},'admin');toast('Radio guardado ✓');adminCargar('ajustes')})">Guardar radio</button>` : ''}</div></div>`).join('')}
    <div class="card"><h3>🔗 Links para compartir</h3>
      ${[['Familias (Instagram, WhatsApp)', A.url], ['Familias · mi cuenta', A.url + '?p=cuenta'], ['Profes', A.url + '?p=profes'], ['Administración', A.url + '?p=admin']].map(([t, u]) => `<div class="lista-item"><div class="crece"><b>${t}</b><div class="muted chico" style="word-break:break-all">${esc(u)}</div></div><button class="btn xs claro" onclick="copiar('${esc(u)}')">Copiar</button></div>`).join('')}
      <a class="btn claro sm" style="margin-top:10px" target="_blank" href="${A.planilla}">Abrir la planilla</a></div>
    <div class="card"><h3>🔐 PIN y mails de la administración</h3>
      ${Object.keys(aj).sort().map(k => `<label>${esc(k.replace('pin_', 'PIN · ').replace('email_', 'Mail de aviso · ').replace('pinGeneral', 'PIN general').replace('emailGeneral', 'Mail general').replace('aldea', 'Aldea de Valle').replace('colonia', 'Colonia de Güey'))}</label><input type="text" class="ajuste" data-k="${k}" value="${esc(aj[k])}">`).join('')}
      <button class="btn" style="margin-top:12px" onclick="conBoton(this, async()=>{const v={};document.querySelectorAll('.ajuste').forEach(x=>v[x.dataset.k]=x.value);await api('guardarAjustes',{valores:v},'admin');toast('Guardado ✓')})">Guardar</button></div>
    <button class="btn claro full" onclick="salir('admin')">Cerrar sesión</button>`;
}
function usarUbic(btn, id) {
  if (!navigator.geolocation) return toast('Sin GPS.', true);
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(p => {
    api('fijarUbicacion', { sede: id, lat: p.coords.latitude, lng: p.coords.longitude, radio: val('rad' + id) }, 'admin')
      .then(() => { toast('Ubicación guardada (precisión ' + Math.round(p.coords.accuracy) + ' m) ✓'); adminCargar('ajustes'); })
      .catch(e => { toast(e.message, true); btn.disabled = false; });
  }, () => { toast('No se pudo leer la ubicación.', true); btn.disabled = false; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}
</script>
</body>
</html>
